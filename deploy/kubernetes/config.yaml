apiVersion: v1
kind: ConfigMap
metadata:
  name: dream-rsi-config
  namespace: dream-rsi
data:
  DREAM_RSI_ENV: production
  DREAM_RSI_REDIS_URL: redis://redis:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: dream-rsi-secrets
  namespace: dream-rsi
type: Opaque
stringData:
  DREAM_RSI_API_KEY: change-me
  DREAM_RSI_POSTGRES_DSN: postgresql://dream_rsi:change-me@postgres:5432/dream_rsi
