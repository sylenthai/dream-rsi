apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dream-rsi-api, namespace: dream-rsi}
spec: {minAvailable: 1, selector: {matchLabels: {app: dream-rsi-api}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: dream-rsi-api, namespace: dream-rsi}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: dream-rsi-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
