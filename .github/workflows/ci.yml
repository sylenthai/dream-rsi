name: CI & Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} · Regression, Compile & CLI Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]
    env:
      # Tests must never fall back to locally installed user packages or leak host credentials.
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      - name: Compile Python bytecode
        run: python -m compileall -q dream_rsi

      - name: Run regression test suite
        run: python -m pytest -q

      - name: Run CLI demo smoke check
        run: python -m dream_rsi.cli.run_demo

      - name: Run autonomous evolution smoke check
        run: python -m dream_rsi.cli.evolve --mock --cycles 1 --memory artifacts/ci-evolve.sqlite3 --output artifacts/ci-evolution-report.json
