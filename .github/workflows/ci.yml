name: CI & Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pytest Suite (59 Tests), Bytecode & CLI Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev,api]" httpx2

      - name: Compile Python bytecode
        run: python -m compileall -q dream_rsi

      - name: Run regression test suite
        run: python -m pytest -q

      - name: Run CLI demo smoke check
        run: python -m dream_rsi.cli.run_demo
